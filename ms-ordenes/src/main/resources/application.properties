spring.application.name=ms-ordenes
# Render define la variable PORT; en local se usa el puerto por defecto del servicio
server.port=${PORT:8084}

# Cada microservicio usa SU PROPIA base de datos (database-per-service).
# La URL del cluster (MongoDB Atlas) llega por variable de entorno.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=ordenes_db
spring.data.mongodb.auto-index-creation=true

# Swagger UI: /swagger-ui.html  |  OpenAPI JSON: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
servicios.clientes.url=${CLIENTES_URL:http://localhost:8081}
servicios.tecnicos.url=${TECNICOS_URL:http://localhost:8082}
servicios.repuestos.url=${REPUESTOS_URL:http://localhost:8083}
# Maximo de ordenes activas por tecnico (regla de asignacion)
ordenes.max-activas=3
