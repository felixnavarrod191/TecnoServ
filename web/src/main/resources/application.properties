spring.application.name=web
server.port=${PORT:8080}

# Base de datos propia de la aplicacion web: solo guarda los usuarios y sus roles
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=web_db
spring.data.mongodb.auto-index-creation=true

# La web llama SOLO al API Gateway; el gateway reenvia cada peticion al microservicio correcto
servicios.clientes.url=${GATEWAY_URL:http://localhost:8090}
servicios.tecnicos.url=${GATEWAY_URL:http://localhost:8090}
servicios.repuestos.url=${GATEWAY_URL:http://localhost:8090}
servicios.ordenes.url=${GATEWAY_URL:http://localhost:8090}
servicios.reportes.url=${GATEWAY_URL:http://localhost:8090}

spring.thymeleaf.cache=false
server.servlet.session.timeout=60m
