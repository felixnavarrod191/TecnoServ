<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Órdenes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: alertas}"></div>

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <h1 class="h3 page-title mb-0" th:text="${titulo}">Órdenes</h1>
    <div class="d-flex gap-2" th:if="${filtro}">
      <form th:action="@{/recepcion/ordenes}" method="get" class="d-flex gap-2 m-0">
        <select name="estado" class="form-select form-select-sm" onchange="this.form.submit()">
          <option value="">Todos los estados</option>
          <option th:each="e : ${estados}" th:value="${e}" th:text="${fmt.estado(e)}" th:selected="${e == estadoSel}">Estado</option>
        </select>
      </form>
      <a class="btn btn-brand btn-sm" th:href="@{/recepcion/ordenes/nueva}">+ Nueva orden</a>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <p class="text-muted p-3 mb-0" th:if="${#lists.isEmpty(ordenes)}">No hay órdenes para mostrar.</p>
      <div class="table-responsive" th:unless="${#lists.isEmpty(ordenes)}">
        <table class="table table-hover mb-0">
          <thead><tr><th>Ingreso</th><th>Cliente</th><th>Equipo</th><th>Reparación</th><th>Técnico</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            <tr th:each="o : ${ordenes}">
              <td class="text-nowrap" th:text="${fmt.fecha(o.fechaIngreso)}">Fecha</td>
              <td class="fw-semibold" th:text="${o.clienteNombre}">Cliente</td>
              <td th:text="${o.equipoDescripcion}">Equipo</td>
              <td th:text="${o.tipoReparacion}">Tipo</td>
              <td th:text="${#strings.isEmpty(o.tecnicoNombre) ? 'Sin asignar' : o.tecnicoNombre}">Técnico</td>
              <td><span class="badge" th:classappend="${fmt.badge(o.estado)}" th:text="${fmt.estado(o.estado)}">Estado</span></td>
              <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/ordenes/{id}(id=${o.id})}">Ver</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
</body>
</html>
