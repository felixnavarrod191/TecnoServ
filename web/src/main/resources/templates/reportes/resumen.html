<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Reportes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: alertas}"></div>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 page-title mb-0">Reporte de costo total</h1>
    <div class="total-box text-end">
      <div class="small text-muted">Total general</div>
      <div class="h4 mb-0" th:text="${fmt.moneda(resumen.totalGeneral)}">$ 0</div>
    </div>
  </div>
  <p class="text-muted">Costo total = (horas trabajadas × tarifa del técnico) + suma de los repuestos usados.</p>

  <div class="card">
    <div class="card-body p-0">
      <p class="text-muted p-3 mb-0" th:if="${#lists.isEmpty(resumen.ordenes)}">Aún no hay órdenes para reportar.</p>
      <div class="table-responsive" th:unless="${#lists.isEmpty(resumen.ordenes)}">
        <table class="table table-hover mb-0">
          <thead><tr><th>Orden</th><th>Cliente</th><th>Equipo</th><th>Técnico</th><th>Estado</th><th>Horas</th><th>Mano de obra</th><th>Repuestos</th><th>Total</th></tr></thead>
          <tbody>
            <tr th:each="r : ${resumen.ordenes}">
              <td><a th:href="@{/ordenes/{id}(id=${r.ordenId})}">Ver orden</a></td>
              <td th:text="${r.clienteNombre}">Cliente</td>
              <td th:text="${r.equipo}">Equipo</td>
              <td th:text="${#strings.isEmpty(r.tecnicoNombre) ? '—' : r.tecnicoNombre}">Técnico</td>
              <td><span class="badge" th:classappend="${fmt.badge(r.estado)}" th:text="${fmt.estado(r.estado)}">Estado</span></td>
              <td th:text="${r.horasTrabajadas}">0</td>
              <td th:text="${fmt.moneda(r.manoObra)}">$ 0</td>
              <td th:text="${fmt.moneda(r.costoRepuestos)}">$ 0</td>
              <td class="fw-bold" th:text="${fmt.moneda(r.total)}">$ 0</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
</body>
</html>
