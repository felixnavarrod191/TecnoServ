<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · TecnoServ'">TecnoServ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Barra de navegación: cada rol ve solo sus opciones -->
<nav th:fragment="nav" class="navbar navbar-expand navbar-dark app-nav" sec:authorize="isAuthenticated()">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" th:href="@{/}">TecnoServ</a>
    <ul class="navbar-nav flex-wrap me-auto">
      <th:block sec:authorize="hasRole('ADMINISTRADOR')">
        <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Panel</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/admin/tecnicos}">Técnicos</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/admin/repuestos}">Repuestos</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/admin/proveedores}">Proveedores</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/admin/pedidos}">Pedidos</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/admin/usuarios}">Usuarios</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/reportes}">Reportes</a></li>
      </th:block>
      <th:block sec:authorize="hasRole('RECEPCIONISTA')">
        <li class="nav-item"><a class="nav-link" th:href="@{/recepcion/ordenes}">Órdenes</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/recepcion/ordenes/nueva}">Nueva orden</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/recepcion/clientes}">Clientes</a></li>
      </th:block>
      <th:block sec:authorize="hasRole('TECNICO')">
        <li class="nav-item"><a class="nav-link" th:href="@{/tecnico/ordenes}">Mis órdenes</a></li>
      </th:block>
      <th:block sec:authorize="hasRole('CLIENTE')">
        <li class="nav-item"><a class="nav-link" th:href="@{/cliente/ordenes}">Mis equipos y órdenes</a></li>
      </th:block>
      <th:block sec:authorize="hasRole('PROVEEDOR')">
        <li class="nav-item"><a class="nav-link" th:href="@{/proveedor}">Repuestos y pedidos</a></li>
      </th:block>
    </ul>
    <div class="d-flex align-items-center gap-3 text-white">
      <div class="text-end small lh-sm">
        <div class="fw-semibold" sec:authentication="principal.nombre">Usuario</div>
        <div class="opacity-75" sec:authentication="principal.rolEtiqueta">Rol</div>
      </div>
      <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-sm btn-outline-light">Salir</button>
      </form>
    </div>
  </div>
</nav>

<!-- Mensajes de éxito o error -->
<div th:fragment="alertas">
  <div th:if="${ok}" class="alert alert-success shadow-sm" th:text="${ok}">Listo</div>
  <div th:if="${error}" class="alert alert-danger shadow-sm" th:text="${error}">Error</div>
</div>

</body>
</html>
