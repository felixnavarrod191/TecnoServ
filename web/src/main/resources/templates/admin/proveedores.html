<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Proveedores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: alertas}"></div>
  <h1 class="h3 page-title mb-4">Proveedores de repuestos</h1>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body p-0">
          <p class="text-muted p-3 mb-0" th:if="${#lists.isEmpty(proveedores)}">Aún no hay proveedores registrados.</p>
          <table class="table table-hover mb-0" th:unless="${#lists.isEmpty(proveedores)}">
            <thead><tr><th>Nombre</th><th>Contacto</th><th>Correo</th><th></th></tr></thead>
            <tbody>
              <tr th:each="p : ${proveedores}">
                <td class="fw-semibold" th:text="${p.nombre}">Nombre</td>
                <td th:text="${p.contacto}">Contacto</td>
                <td th:text="${p.correo}">correo</td>
                <td class="text-end text-nowrap">
                  <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/proveedores(editar=${p.id})}">Editar</a>
                  <form th:action="@{/admin/proveedores/{id}/eliminar(id=${p.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar este proveedor?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card">
        <div class="card-header" th:text="${form.id != null} ? 'Editar proveedor' : 'Nuevo proveedor'">Nuevo proveedor</div>
        <div class="card-body">
          <form th:action="@{/admin/proveedores}" method="post">
            <input type="hidden" name="id" th:value="${form.id}">
            <div class="mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control" th:value="${form.nombre}" required></div>
            <div class="mb-3"><label class="form-label">Persona de contacto</label><input name="contacto" class="form-control" th:value="${form.contacto}"></div>
            <div class="mb-3"><label class="form-label">Correo</label><input name="correo" type="email" class="form-control" th:value="${form.correo}"></div>
            <button type="submit" class="btn btn-brand w-100">Guardar</button>
            <a th:if="${form.id != null}" class="btn btn-link w-100 mt-1" th:href="@{/admin/proveedores}">Cancelar edición</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
