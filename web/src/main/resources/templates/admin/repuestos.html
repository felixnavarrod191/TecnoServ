<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Repuestos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: alertas}"></div>
  <h1 class="h3 page-title mb-4">Repuestos e inventario</h1>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body p-0">
          <p class="text-muted p-3 mb-0" th:if="${#lists.isEmpty(repuestos)}">Aún no hay repuestos registrados.</p>
          <table class="table table-hover mb-0" th:unless="${#lists.isEmpty(repuestos)}">
            <thead><tr><th>Código</th><th>Repuesto</th><th>Stock</th><th>Mín.</th><th>Precio</th><th>Proveedor</th><th></th></tr></thead>
            <tbody>
              <tr th:each="r : ${repuestos}">
                <td th:text="${r.codigo}">REP</td>
                <td class="fw-semibold" th:text="${r.nombre}">Nombre</td>
                <td><span class="badge" th:classappend="${r.stock le r.stockMinimo} ? 'text-bg-warning' : 'text-bg-success'" th:text="${r.stock}">0</span></td>
                <td th:text="${r.stockMinimo}">0</td>
                <td th:text="${fmt.moneda(r.precioUnitario)}">$ 0</td>
                <td th:text="${r.proveedorId != null ? nombresProveedor[r.proveedorId] : '—'}">Proveedor</td>
                <td class="text-end text-nowrap">
                  <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/repuestos(editar=${r.id})}">Editar</a>
                  <form th:action="@{/admin/repuestos/{id}/eliminar(id=${r.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar este repuesto?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card">
        <div class="card-header" th:text="${form.id != null} ? 'Editar repuesto' : 'Nuevo repuesto'">Nuevo repuesto</div>
        <div class="card-body">
          <form th:action="@{/admin/repuestos}" method="post">
            <input type="hidden" name="id" th:value="${form.id}">
            <div class="mb-3"><label class="form-label">Código</label><input name="codigo" class="form-control" th:value="${form.codigo}" required></div>
            <div class="mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control" th:value="${form.nombre}" required></div>
            <div class="row g-2 mb-3">
              <div class="col"><label class="form-label">Stock</label><input name="stock" type="number" min="0" class="form-control" th:value="${form.stock}" required></div>
              <div class="col"><label class="form-label">Stock mínimo</label><input name="stockMinimo" type="number" min="0" class="form-control" th:value="${form.stockMinimo}" required></div>
            </div>
            <div class="mb-3"><label class="form-label">Precio unitario (COP)</label><input name="precioUnitario" type="number" min="0" step="100" class="form-control" th:value="${form.precioUnitario}" required></div>
            <div class="mb-3">
              <label class="form-label">Proveedor</label>
              <select name="proveedorId" class="form-select">
                <option value="">Sin proveedor</option>
                <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.nombre}" th:selected="${p.id == form.proveedorId}">Proveedor</option>
              </select>
            </div>
            <button type="submit" class="btn btn-brand w-100">Guardar</button>
            <a th:if="${form.id != null}" class="btn btn-link w-100 mt-1" th:href="@{/admin/repuestos}">Cancelar edición</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
