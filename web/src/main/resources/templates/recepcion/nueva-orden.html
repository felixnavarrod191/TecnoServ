<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Nueva orden')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4" style="max-width: 760px">
  <div th:replace="~{fragments/layout :: alertas}"></div>
  <h1 class="h3 page-title mb-4">Nueva orden de servicio</h1>

  <div class="card mb-3">
    <div class="card-header">1. Cliente</div>
    <div class="card-body">
      <form th:action="@{/recepcion/ordenes/nueva}" method="get" class="row g-2">
        <div class="col-sm-9">
          <select name="clienteId" class="form-select" required>
            <option value="">Selecciona un cliente…</option>
            <option th:each="c : ${clientes}" th:value="${c.id}" th:selected="${c.id == clienteId}"
                    th:text="${c.nombre + ' · ' + c.documento}">Cliente</option>
          </select>
        </div>
        <div class="col-sm-3 d-grid"><button type="submit" class="btn btn-outline-primary">Continuar</button></div>
      </form>
      <p class="small text-muted mt-2 mb-0">¿El cliente es nuevo? Primero regístralo en <a th:href="@{/recepcion/clientes}">Clientes</a>.</p>
    </div>
  </div>

  <div class="card" th:if="${clienteId != ''}">
    <div class="card-header">2. Equipo y falla</div>
    <div class="card-body">
      <div class="alert alert-warning" th:if="${#lists.isEmpty(equipos)}">
        Este cliente no tiene equipos registrados.
        <a th:href="@{/recepcion/clientes/{id}(id=${clienteId})}">Registrar un equipo</a>
      </div>
      <form th:unless="${#lists.isEmpty(equipos)}" th:action="@{/recepcion/ordenes}" method="post">
        <input type="hidden" name="clienteId" th:value="${clienteId}">
        <div class="mb-3">
          <label class="form-label">Equipo</label>
          <select name="equipoId" class="form-select" required>
            <option th:each="e : ${equipos}" th:value="${e.id}"
                    th:text="${e.tipo + ' · ' + #strings.defaultString(e.marca, '') + ' ' + #strings.defaultString(e.modelo, '') + ' (' + e.serial + ')'}">Equipo</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Tipo de reparación</label>
          <select name="tipoReparacion" class="form-select" required>
            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}">Tipo</option>
          </select>
          <div class="form-text">Se usa para asignar un técnico con esa especialidad.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Falla reportada</label>
          <textarea name="fallaReportada" rows="3" class="form-control" required></textarea>
        </div>
        <button type="submit" class="btn btn-brand">Crear orden</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
