<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body class="login-bg">
<div class="login-card card">
  <div class="card-body p-4">
    <h1 class="h3 fw-bold text-center mb-1" style="color: var(--brand)">TecnoServ</h1>
    <p class="text-center text-muted mb-4">Control de mantenimiento y servicios técnicos</p>
    <div th:if="${param.error}" class="alert alert-danger py-2">Usuario o contraseña incorrectos</div>
    <div th:if="${param.salio}" class="alert alert-success py-2">Cerraste sesión correctamente</div>
    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input name="username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-brand w-100">Ingresar</button>
    </form>
  </div>
</div>
</body>
</html>
