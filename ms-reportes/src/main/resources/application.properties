spring.application.name=ms-reportes
# Render define la variable PORT; en local se usa el puerto por defecto del servicio
server.port=${PORT:8085}

# Cada microservicio usa SU PROPIA base de datos (database-per-service).
# La URL del cluster (MongoDB Atlas) llega por variable de entorno.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=reportes_db
spring.data.mongodb.auto-index-creation=true

# Swagger UI: /swagger-ui.html  |  OpenAPI JSON: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
servicios.ordenes.url=${ORDENES_URL:http://localhost:8084}
